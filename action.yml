name: 'Brimyr'
description: 'Patch-coverage gate: run tests with coverage and gate on the coverage of the lines a PR changed.'
author: 'Caleb Sargeant'
branding:
  icon: 'umbrella'
  color: 'purple'

inputs:
  # ── Checkout ─────────────────────────────────────────────────────────────
  checkout:
    description: 'Run actions/checkout first. Patch coverage needs full history (fetch-depth 0).'
    required: false
    default: 'true'
  fetch_depth:
    description: 'Checkout fetch-depth. MUST be 0 for patch coverage (merge-base).'
    required: false
    default: '0'

  # ── Gate behaviour ───────────────────────────────────────────────────────
  mode:
    description: 'auto | pr (patch-coverage gate) | baseline (trend only, no gate).'
    required: false
    default: 'auto'
  threshold:
    description: 'Patch-coverage threshold (%) that blocks below it.'
    required: false
    default: '80'
  base_ref:
    description: 'Override the base ref/SHA (default: PR base SHA from the event).'
    required: false
    default: ''
  head_ref:
    description: 'Override the head ref/SHA (default: PR head SHA, else github.sha).'
    required: false
    default: ''
  pr_comment:
    description: 'Post/update one consolidated patch-coverage comment on the PR. Non-blocking.'
    required: false
    default: 'false'
  token_broker_url:
    description: >-
      Token broker base URL, e.g. https://broker-brimyr.magmamoose.com. When set, the PR
      comment is authored by Brimyr[bot] rather than github-actions[bot]. Requires the
      calling job to declare `permissions: id-token: write`. Fails SOFT and SILENTLY: any
      problem falls back to github_token, so a broken broker costs a byline, never a
      comment. broker-smoke.yml is what notices.
    required: false
    default: ''

  github_token:
    description: >-
      Token used to comment. Needs `pull-requests: write`. Defaults to the job
      GITHUB_TOKEN, which comments as github-actions[bot].
    required: false
    default: ${{ github.token }}

  exclude:
    description: >-
      Comma-separated globs whose matching CHANGED FILES are dropped from the
      patch-coverage denominator entirely — they are not counted as covered, they simply
      do not count. For generated code: EF Core migrations, *ModelSnapshot, *.Designer.cs,
      generated Razor documents, protobuf/OpenAPI stubs. One scaffolded migration in a PR
      can otherwise sink an otherwise well-tested change below the threshold.
      e.g. "*Migrations*,*ModelSnapshot*,*.Designer.cs,*AspNetCoreGeneratedDocument*"
    required: false
    default: ''

  strip_prefix:
    description: 'Comma-separated path prefixes to strip from coverage paths before matching.'
    required: false
    default: ''

  # ── Test run / coverage ──────────────────────────────────────────────────
  ecosystem:
    description: 'Force ecosystem(s): comma-separated python|javascript|dotnet|java (default: auto-detect).'
    required: false
    default: ''
  test_command:
    description: 'Override the detected test command (a shell command string).'
    required: false
    default: ''
  coverage_file:
    description: 'Escape hatch: ingest pre-made coverage file(s) "path[:format]", comma-separated, instead of running tests.'
    required: false
    default: ''

  # ── SonarQube (optional, non-blocking) ───────────────────────────────────
  sonar_url:
    description: 'SonarQube host URL. Set to run a non-blocking sonar-scanner pass.'
    required: false
    default: ''
  sonar_token:
    description: 'SonarQube token (pass a secret). Used only if sonar_url is set.'
    required: false
    default: ''
  sonar_project_key:
    description: 'Sonar project key.'
    required: false
    default: ''
  sonar_organization:
    description: 'Sonar organization (SonarCloud).'
    required: false
    default: ''
  sonar_sources:
    description: 'sonar.sources (default: the repo root).'
    required: false
    default: ''
  sonar_args:
    description: >-
      Extra Sonar properties, comma-separated, each as `-Dkey=value`. The escape hatch
      for anything not modelled — `sonar.java.binaries` (REQUIRED for Java, see below),
      `sonar.coverage.exclusions`, `sonar.projectVersion`.
    required: false
    default: ''
  sonar_scanner_version:
    description: >-
      SonarScanner CLI version installed when sonar_url is set and the repo is not .NET.
      .NET repos get `dotnet-sonarscanner` instead — the CLI scanner cannot analyze C#.
    required: false
    default: '8.1.0.6389'

  # ── Output ───────────────────────────────────────────────────────────────
  emit_json_artifact:
    description: 'Upload the patch-coverage JSON summary as a build artifact.'
    required: false
    default: 'true'
  json_artifact_name:
    description: 'Artifact name for the patch-coverage JSON summary.'
    required: false
    default: 'brimyr-coverage'

  python_version:
    description: 'Python version used to run the brimyr CLI.'
    required: false
    default: '3.12'

outputs:
  mode:
    description: 'Resolved run mode (pr | baseline).'
    value: ${{ steps.brimyr.outputs.mode }}
  gate_result:
    description: 'pass | fail | error.'
    value: ${{ steps.brimyr.outputs.gate_result }}
  patch_coverage:
    description: 'Patch coverage percentage (covered changed executable lines / total).'
    value: ${{ steps.brimyr.outputs.patch_coverage }}
  covered_lines:
    description: 'Covered changed executable lines.'
    value: ${{ steps.brimyr.outputs.covered_lines }}
  total_lines:
    description: 'Total changed executable lines (the patch-coverage denominator).'
    value: ${{ steps.brimyr.outputs.total_lines }}
  total_coverage:
    # NOT `total_lines` — that name already ships meaning the patch denominator.
    # Empty string when the run measured nothing, never '0.00': an unmeasured run and a
    # genuinely zero-covered one must not look the same to a downstream `if`.
    description: >-
      Overall coverage percentage across the files the run MEASURED (reported, never
      gated on). Not the repository's coverage: a file no test imports is absent from
      the report and therefore absent from this denominator. Empty when nothing was
      measured.
    value: ${{ steps.brimyr.outputs.total_coverage }}

runs:
  using: composite
  steps:
    - name: Checkout
      if: ${{ inputs.checkout == 'true' }}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: ${{ inputs.fetch_depth }}

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python_version }}

    - name: Install brimyr
      shell: bash
      run: python -m pip install --disable-pip-version-check --quiet "$GITHUB_ACTION_PATH"

    # Without this the Sonar leg is a silent no-op: nothing installs a scanner, so every
    # run reported "skipped (sonar-scanner not found on PATH)" while the build stayed
    # green. Only runs when a host URL is actually set, so the cost is zero otherwise.
    - name: Install SonarScanner
      if: inputs.sonar_url != ''
      # Non-fatal BY CONTRACT. Everything about the Sonar leg is failure-isolated — an
      # outage or a bad URL is a warning and the run continues — and an install that can
      # fail the composite action would break that guarantee at the one point the rest of
      # the design cannot defend. If this step fails, no scanner lands on PATH, brimyr
      # reports "skipped (not found on PATH)", and the gate is unaffected.
      continue-on-error: true
      shell: bash
      env:
        SCANNER_VERSION: ${{ inputs.sonar_scanner_version }}
      run: |
        set -euo pipefail

        # SCANNER_VERSION is consumer-controlled and lands in a line appended to
        # $GITHUB_PATH, so an embedded newline would let it prepend an arbitrary
        # directory to PATH for every later step. Digits and dots only.
        # `case` and not `grep -E`: grep matches per LINE, so "8.1.0\n/tmp/evil/bin"
        # passes an anchored regex on the strength of its first line — which is the whole
        # injection. A shell glob tests the entire value, newlines included.
        case "$SCANNER_VERSION" in
          ''|*[!0-9.]*)
            echo "::error::sonar_scanner_version must be digits and dots only"
            exit 1 ;;
        esac
        # C#/VB.NET cannot be analyzed by the CLI scanner at all — Sonar documents this —
        # so a .NET repo needs the MSBuild-integrated scanner instead. Pick by what is in
        # the tree, not by an input, so a consumer cannot get it wrong.
        if command -v dotnet >/dev/null 2>&1 \
           && find . -maxdepth 4 \( -name '*.sln' -o -name '*.csproj' -o -name '*.vbproj' \) \
                -not -path './.git/*' -print -quit | grep -q .; then
          # Already-installed is not an error: `dotnet tool install` exits non-zero when
          # the tool is present, which is the normal case on a self-hosted or cached
          # runner. Fall through to update, then to "it is already there".
          dotnet tool install --global dotnet-sonarscanner >/dev/null 2>&1 \
            || dotnet tool update --global dotnet-sonarscanner >/dev/null 2>&1 \
            || true
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
          echo "using dotnet-sonarscanner"
          exit 0
        fi

        base="https://binaries.sonarsource.com/Distribution/sonar-scanner-cli"
        zip="sonar-scanner-cli-${SCANNER_VERSION}-linux-x64.zip"
        tmp="$(mktemp -d)"
        curl -fsSL --retry 3 -o "$tmp/$zip" "$base/$zip"
        # Verify against SonarSource's published digest rather than a hash pinned in this
        # file — a hardcoded one goes stale the moment the version input is bumped, and a
        # stale hash that nobody updates gets deleted rather than fixed.
        curl -fsSL --retry 3 -o "$tmp/$zip.sha256" "$base/$zip.sha256"
        expected="$(cut -d' ' -f1 < "$tmp/$zip.sha256")"
        actual="$(sha256sum "$tmp/$zip" | cut -d' ' -f1)"
        if [ "$expected" != "$actual" ]; then
          echo "::error::SonarScanner checksum mismatch (expected $expected, got $actual)"
          exit 1
        fi
        unzip -q "$tmp/$zip" -d "$HOME/.sonar"
        echo "$HOME/.sonar/sonar-scanner-${SCANNER_VERSION}-linux-x64/bin" >> "$GITHUB_PATH"
        echo "installed sonar-scanner ${SCANNER_VERSION}"

    - name: Brimyr gate
      id: brimyr
      shell: bash
      env:
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        SONAR_TOKEN: ${{ inputs.sonar_token }}
        BASE_REF_IN: ${{ inputs.base_ref }}
        HEAD_REF_IN: ${{ inputs.head_ref }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        GH_SHA: ${{ github.sha }}
        # All inputs flow through env (never interpolated into the script body)
        # so a malicious value can't break out of the shell — defense-in-depth
        # against `${{ }}` template injection.
        MODE_IN: ${{ inputs.mode }}
        THRESHOLD_IN: ${{ inputs.threshold }}
        STRIP_PREFIX_IN: ${{ inputs.strip_prefix }}
        EXCLUDE_IN: ${{ inputs.exclude }}
        ECOSYSTEM_IN: ${{ inputs.ecosystem }}
        TEST_COMMAND_IN: ${{ inputs.test_command }}
        COVERAGE_FILE_IN: ${{ inputs.coverage_file }}
        SONAR_URL_IN: ${{ inputs.sonar_url }}
        SONAR_PROJECT_KEY_IN: ${{ inputs.sonar_project_key }}
        SONAR_ORG_IN: ${{ inputs.sonar_organization }}
        SONAR_SOURCES_IN: ${{ inputs.sonar_sources }}
        SONAR_ARGS_IN: ${{ inputs.sonar_args }}
        PR_COMMENT_IN: ${{ inputs.pr_comment }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        PR_NUMBER_IN: ${{ github.event.pull_request.number }}
        TOKEN_BROKER_URL_IN: ${{ inputs.token_broker_url }}
      run: |
        set -euo pipefail
        json_rel="brimyr-reports/coverage.json"
        json_abs="${GITHUB_WORKSPACE:-$PWD}/$json_rel"
        mkdir -p "$(dirname "$json_abs")"
        echo "json_path=$json_rel" >> "$GITHUB_OUTPUT"

        base="${BASE_REF_IN:-$PR_BASE_SHA}"
        head="${HEAD_REF_IN:-${PR_HEAD_SHA:-$GH_SHA}}"

        args=(ci
          --mode "$MODE_IN"
          --threshold "$THRESHOLD_IN"
          --repo "."
          --head "$head"
          --json-out "$json_abs")
        [ -n "$base" ] && args+=(--base "$base")
        [ -n "$TEST_COMMAND_IN" ] && args+=(--test-command "$TEST_COMMAND_IN")

        IFS=',' read -ra _eco <<< "$ECOSYSTEM_IN"
        for e in "${_eco[@]}"; do [ -n "$e" ] && args+=(--ecosystem "$e"); done
        IFS=',' read -ra _cov <<< "$COVERAGE_FILE_IN"
        for c in "${_cov[@]}"; do [ -n "$c" ] && args+=(--coverage-file "$c"); done
        IFS=',' read -ra _sp <<< "$STRIP_PREFIX_IN"
        for p in "${_sp[@]}"; do [ -n "$p" ] && args+=(--strip-prefix "$p"); done
        IFS=',' read -ra _ex <<< "$EXCLUDE_IN"
        for e in "${_ex[@]}"; do [ -n "$e" ] && args+=(--exclude "$e"); done

        if [ -n "$SONAR_URL_IN" ]; then
          args+=(--sonar-url "$SONAR_URL_IN")
          [ -n "$SONAR_PROJECT_KEY_IN" ] && args+=(--sonar-project-key "$SONAR_PROJECT_KEY_IN")
          [ -n "$SONAR_ORG_IN" ] && args+=(--sonar-organization "$SONAR_ORG_IN")
          [ -n "$SONAR_SOURCES_IN" ] && args+=(--sonar-sources "$SONAR_SOURCES_IN")
          IFS=',' read -ra _sa <<< "$SONAR_ARGS_IN"
          for a in "${_sa[@]}"; do [ -n "$a" ] && args+=(--sonar-arg "$a"); done
        fi

        if [ "$PR_COMMENT_IN" = "true" ] && [ -n "${PR_NUMBER_IN:-}" ]; then
          args+=(--pr-comment --pr-number "$PR_NUMBER_IN")
          [ -n "$TOKEN_BROKER_URL_IN" ] && args+=(--token-broker-url "$TOKEN_BROKER_URL_IN")
        fi

        brimyr "${args[@]}"

    - name: Upload coverage JSON artifact
      if: ${{ always() && inputs.emit_json_artifact == 'true' && steps.brimyr.outputs.json_path != '' && hashFiles(steps.brimyr.outputs.json_path) != '' }}
      continue-on-error: true
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.json_artifact_name }}
        path: ${{ steps.brimyr.outputs.json_path }}
