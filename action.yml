name: 'Brimyr'
description: 'Quality assurance for a pull request: run tests with coverage and gate on the coverage of the lines a PR changed, and on the net-new quality findings it introduced.'
author: 'Caleb Sargeant'
branding:
  icon: 'umbrella'
  color: 'purple'

inputs:
  # ── Checkout ─────────────────────────────────────────────────────────────
  checkout:
    description: 'Run actions/checkout first. Patch coverage needs full history (fetch-depth 0).'
    required: false
    default: 'true'
  fetch_depth:
    description: 'Checkout fetch-depth. MUST be 0 for patch coverage (merge-base).'
    required: false
    default: '0'

  # ── Gate behaviour ───────────────────────────────────────────────────────
  mode:
    description: 'auto | pr (gate on patch coverage, and on quality when enabled) | baseline (trend only, no gate).'
    required: false
    default: 'auto'
  threshold:
    description: 'Patch-coverage threshold (%) that blocks below it.'
    required: false
    default: '80'
  min_lines:
    description: >-
      Do not gate a diff with fewer than N changed executable lines — below that the
      percentage is too coarse to mean anything (1 uncovered line in 3 is 67%, which
      fails an 80% gate while telling you nothing). SonarQube applies the same rule at
      the same number, so matching it keeps the two verdicts from disagreeing on small
      PRs. It IS a deliberate hole — a 19-line untested change passes — so Brimyr says
      so in the summary rather than passing quietly. Set to '0' to gate every diff.
    required: false
    default: '20'
  base_ref:
    description: 'Override the base ref/SHA (default: PR base SHA from the event).'
    required: false
    default: ''
  head_ref:
    description: 'Override the head ref/SHA (default: PR head SHA, else github.sha).'
    required: false
    default: ''
  pr_comment:
    description: 'Post/update one consolidated patch-coverage comment on the PR. Non-blocking.'
    required: false
    default: 'false'
  token_broker_url:
    description: >-
      Token broker base URL, e.g. https://broker-brimyr.magmamoose.com. When set, the PR
      comment is authored by Brimyr[bot] rather than github-actions[bot]. Requires the
      calling job to declare `permissions: id-token: write`. Fails SOFT and SILENTLY: any
      problem falls back to github_token, so a broken broker costs a byline, never a
      comment. broker-smoke.yml is what notices.
    required: false
    default: ''

  github_token:
    description: >-
      Token used to comment. Needs `pull-requests: write`. Defaults to the job
      GITHUB_TOKEN, which comments as github-actions[bot].
    required: false
    default: ${{ github.token }}

  exclude:
    description: >-
      Comma-separated globs whose matching CHANGED FILES are dropped from the
      patch-coverage denominator entirely — they are not counted as covered, they simply
      do not count. For generated code: EF Core migrations, *ModelSnapshot, *.Designer.cs,
      generated Razor documents, protobuf/OpenAPI stubs. One scaffolded migration in a PR
      can otherwise sink an otherwise well-tested change below the threshold.
      e.g. "*Migrations*,*ModelSnapshot*,*.Designer.cs,*AspNetCoreGeneratedDocument*"
    required: false
    default: ''

  strip_prefix:
    description: 'Comma-separated path prefixes to strip from coverage paths before matching.'
    required: false
    default: ''

  # ── Test run / coverage ──────────────────────────────────────────────────
  ecosystem:
    description: 'Force ecosystem(s): comma-separated python|javascript|dotnet|java (default: auto-detect).'
    required: false
    default: ''
  test_command:
    description: 'Override the detected test command (a shell command string).'
    required: false
    default: ''
  coverage_file:
    description: 'Escape hatch: ingest pre-made coverage file(s) "path[:format]", comma-separated, instead of running tests.'
    required: false
    default: ''

  # ── SonarQube (optional, non-blocking) ───────────────────────────────────
  sonar_url:
    description: 'SonarQube host URL. Set to run a non-blocking sonar-scanner pass.'
    required: false
    default: ''
  sonar_token:
    description: 'SonarQube token (pass a secret). Used only if sonar_url is set.'
    required: false
    default: ''
  sonar_project_key:
    description: 'Sonar project key.'
    required: false
    default: ''
  sonar_organization:
    description: 'Sonar organization (SonarCloud).'
    required: false
    default: ''
  sonar_sources:
    description: 'sonar.sources (default: the repo root).'
    required: false
    default: ''
  sonar_args:
    description: >-
      Extra Sonar properties, comma-separated, each as `-Dkey=value`. The escape hatch
      for anything not modelled — `sonar.java.binaries` (REQUIRED for Java, see below),
      `sonar.coverage.exclusions`, `sonar.projectVersion`.
    required: false
    default: ''
  sonar_scanner_version:
    description: >-
      SonarScanner CLI version installed when sonar_url is set and the repo is not .NET.
      .NET repos get `dotnet-sonarscanner` instead — the CLI scanner cannot analyze C#.
    required: false
    default: '8.1.0.6389'

  # ── Output ───────────────────────────────────────────────────────────────
  html_report:
    description: >-
      Render the coverage reports to a browsable HTML report and upload it as a build
      artifact. Wraps ReportGenerator (Apache-2.0), which sniffs Cobertura, lcov and
      JaCoCo per file, so a polyglot repo gets one report. Off by default: it installs
      ReportGenerator, which is free on GitHub-hosted runners (the .NET SDK is
      preinstalled) but needs `actions/setup-dotnet` on container or self-hosted
      runners. Failure-isolated — a missing renderer never affects the gate.
    required: false
    default: 'false'
  html_artifact_name:
    description: 'Artifact name for the HTML coverage report.'
    required: false
    default: 'brimyr-coverage-html'

  emit_json_artifact:
    description: 'Upload the patch-coverage JSON summary as a build artifact.'
    required: false
    default: 'true'
  json_artifact_name:
    description: 'Artifact name for the patch-coverage JSON summary.'
    required: false
    default: 'brimyr-coverage'

  # ── Quality findings (optional, via Chargate) ────────────────────────────
  # Brimyr is quality assurance, and coverage is only half of that. Chargate already owns
  # a finished net-new engine, so this CALLS it across a process boundary rather than
  # sharing a library — MagmaMoose/brimyr#33. Chargate reports; brimyr gates.
  quality:
    description: >-
      Also gate on net-new QUALITY findings. Runs Chargate as a nested step (MegaLinter's
      quality linters -> SARIF -> net-new classification against this PR's diff), then
      brimyr decides pass/fail on quality_fail_on and folds the verdict into the same job
      summary and the same PR comment as coverage. Off by default; needs Docker on the
      runner. Report-only even when on, until you set quality_fail_on.
    required: false
    default: 'false'
  quality_fail_on:
    description: >-
      SARIF level at or above which a net-new quality finding blocks: none (default --
      report-only) | note | warning | error | any. Deliberately `none` out of the box:
      MegaLinter's quality half over a mature repo is dense, and a first PR that goes red
      with hundreds of findings is how a gate becomes decoration nobody reads. Measure a
      release cycle, then pick a level. `error` is the equivalent of Chargate `fail_on: high`.
    required: false
    default: 'none'
  quality_linters:
    description: >-
      Comma-separated MegaLinter linter keys to run instead of Chargate's curated
      `quality` set (GO_GOLANGCI_LINT, JAVASCRIPT_ES, JAVA_PMD, PYTHON_RUFF,
      TYPESCRIPT_ES). A linter that emits no SARIF is invisible to the gate, and Chargate
      skips it by name with a reason rather than running it for nothing.
    required: false
    default: ''
  quality_json_artifact_name:
    description: 'Artifact name for the quality JSON summary (uploaded when quality is on).'
    required: false
    default: 'brimyr-quality'

  python_version:
    description: >-
      Python version used to run the brimyr CLI. NOTE: `actions/setup-python` changes the
      job's Python for every step AFTER this action, which is a side effect a gate should
      not have. Brimyr itself is installed into its own venv and invoked by absolute
      path, so it does not depend on this — leave it alone unless the runner's default
      Python is older than 3.11.'
    required: false
    default: '3.12'

outputs:
  mode:
    description: 'Resolved run mode (pr | baseline).'
    value: ${{ steps.brimyr.outputs.mode }}
  gate_result:
    description: 'pass | fail | error.'
    value: ${{ steps.brimyr.outputs.gate_result }}
  patch_coverage:
    description: 'Patch coverage percentage (covered changed executable lines / total).'
    value: ${{ steps.brimyr.outputs.patch_coverage }}
  covered_lines:
    description: 'Covered changed executable lines.'
    value: ${{ steps.brimyr.outputs.covered_lines }}
  total_lines:
    description: 'Total changed executable lines (the patch-coverage denominator).'
    value: ${{ steps.brimyr.outputs.total_lines }}
  total_coverage:
    # NOT `total_lines` — that name already ships meaning the patch denominator.
    # Empty string when the run measured nothing, never '0.00': an unmeasured run and a
    # genuinely zero-covered one must not look the same to a downstream `if`.
    description: >-
      Overall coverage percentage across the files the run MEASURED (reported, never
      gated on). Not the repository's coverage: a file no test imports is absent from
      the report and therefore absent from this denominator. Empty when nothing was
      measured.
    value: ${{ steps.brimyr.outputs.total_coverage }}
  quality_gate_result:
    description: >-
      pass | fail | error for the quality half — `error` when the scan did not complete,
      which is the state a consumer most needs to notice: it is a tool error, not zero
      findings. Empty when quality is off.
    value: ${{ steps.brimyr.outputs.quality_gate_result }}
  quality_net_new_count:
    description: 'Net-new (PR-introduced) quality findings. Empty when quality is off.'
    value: ${{ steps.brimyr.outputs.quality_net_new_count }}
  quality_blocking_count:
    description: 'Net-new quality findings at or above quality_fail_on.'
    value: ${{ steps.brimyr.outputs.quality_blocking_count }}
  quality_fail_on:
    # With `fail_on: none` a report-only run and a genuinely clean one both report
    # `pass`. They are not the same thing, so the threshold ships alongside the verdict.
    description: 'The quality threshold that was in force. Empty when quality is off.'
    value: ${{ steps.brimyr.outputs.quality_fail_on }}

runs:
  using: composite
  steps:
    - name: Checkout
      if: ${{ inputs.checkout == 'true' }}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: ${{ inputs.fetch_depth }}

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python_version }}

    # Into a DEDICATED venv, not the job's interpreter. `pip install` into the ambient
    # environment writes into whatever `site-packages` the consumer's job is using — the
    # same one their own test dependencies live in. Brimyr declares no dependencies, so
    # the blast radius today is small, but "small" is not "none": pip still resolves,
    # still writes a console script onto PATH, and a future dependency here would become
    # a resolver conflict in someone else's test run. A composite action has no business
    # mutating its caller's interpreter.
    #
    # `python -m venv` and not `uv tool install`: uv would mean every consumer of this
    # action also pulls setup-uv, and adding an external action to the critical path of a
    # gate is a worse trade than four lines of stdlib.
    - name: Install brimyr
      id: install
      shell: bash
      run: |
        set -euo pipefail
        venv="${RUNNER_TEMP:-/tmp}/brimyr-venv"
        python -m venv "$venv"
        "$venv/bin/python" -m pip install --disable-pip-version-check --quiet \
          "$GITHUB_ACTION_PATH"
        # Absolute path, exported for the gate step. Deliberately NOT added to
        # $GITHUB_PATH: that would put this venv's bin ahead of the consumer's tools for
        # every later step in their job, which is the side effect being removed.
        echo "bin=$venv/bin/brimyr" >> "$GITHUB_OUTPUT"

    # Without this the Sonar leg is a silent no-op: nothing installs a scanner, so every
    # run reported "skipped (sonar-scanner not found on PATH)" while the build stayed
    # green. Only runs when a host URL is actually set, so the cost is zero otherwise.
    - name: Install SonarScanner
      if: inputs.sonar_url != ''
      # Non-fatal BY CONTRACT. Everything about the Sonar leg is failure-isolated — an
      # outage or a bad URL is a warning and the run continues — and an install that can
      # fail the composite action would break that guarantee at the one point the rest of
      # the design cannot defend. If this step fails, no scanner lands on PATH, brimyr
      # reports "skipped (not found on PATH)", and the gate is unaffected.
      continue-on-error: true
      shell: bash
      env:
        SCANNER_VERSION: ${{ inputs.sonar_scanner_version }}
      run: |
        set -euo pipefail

        # SCANNER_VERSION is consumer-controlled and lands in a line appended to
        # $GITHUB_PATH, so an embedded newline would let it prepend an arbitrary
        # directory to PATH for every later step. Digits and dots only.
        # `case` and not `grep -E`: grep matches per LINE, so "8.1.0\n/tmp/evil/bin"
        # passes an anchored regex on the strength of its first line — which is the whole
        # injection. A shell glob tests the entire value, newlines included.
        case "$SCANNER_VERSION" in
          ''|*[!0-9.]*)
            echo "::error::sonar_scanner_version must be digits and dots only"
            exit 1 ;;
        esac
        # C#/VB.NET cannot be analyzed by the CLI scanner at all — Sonar documents this —
        # so a .NET repo needs the MSBuild-integrated scanner instead. Pick by what is in
        # the tree, not by an input, so a consumer cannot get it wrong.
        if command -v dotnet >/dev/null 2>&1 \
           && find . -maxdepth 4 \( -name '*.sln' -o -name '*.csproj' -o -name '*.vbproj' \) \
                -not -path './.git/*' -print -quit | grep -q .; then
          # Already-installed is not an error: `dotnet tool install` exits non-zero when
          # the tool is present, which is the normal case on a self-hosted or cached
          # runner. Fall through to update, then to "it is already there".
          dotnet tool install --global dotnet-sonarscanner >/dev/null 2>&1 \
            || dotnet tool update --global dotnet-sonarscanner >/dev/null 2>&1 \
            || true
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
          echo "using dotnet-sonarscanner"
          exit 0
        fi

        base="https://binaries.sonarsource.com/Distribution/sonar-scanner-cli"
        zip="sonar-scanner-cli-${SCANNER_VERSION}-linux-x64.zip"
        tmp="$(mktemp -d)"
        curl -fsSL --retry 3 -o "$tmp/$zip" "$base/$zip"
        # Verify against SonarSource's published digest rather than a hash pinned in this
        # file — a hardcoded one goes stale the moment the version input is bumped, and a
        # stale hash that nobody updates gets deleted rather than fixed.
        curl -fsSL --retry 3 -o "$tmp/$zip.sha256" "$base/$zip.sha256"
        expected="$(cut -d' ' -f1 < "$tmp/$zip.sha256")"
        actual="$(sha256sum "$tmp/$zip" | cut -d' ' -f1)"
        if [ "$expected" != "$actual" ]; then
          echo "::error::SonarScanner checksum mismatch (expected $expected, got $actual)"
          exit 1
        fi
        unzip -q "$tmp/$zip" -d "$HOME/.sonar"

        # Locate the bin/ directory by looking at what was actually extracted, rather
        # than interpolating SCANNER_VERSION into the path. The `case` guard above already
        # rejects anything but digits and dots, but this removes the consumer-controlled
        # value from the $GITHUB_PATH line altogether — no taint flow left to reason about,
        # and it no longer assumes the archive's directory naming.
        bindir="$(find "$HOME/.sonar" -maxdepth 2 -type d -name bin -print -quit)"
        if [ -z "$bindir" ]; then
          echo "::warning::sonar-scanner archive had no bin/ directory; skipping Sonar"
          exit 0
        fi
        printf '%s\n' "$bindir" >> "$GITHUB_PATH"
        echo "installed sonar-scanner"

    # Only when asked for. ReportGenerator is framework-dependent .NET with no
    # self-contained build; GitHub-hosted images ship the SDK so `--tool-path` needs no
    # project, but a container or self-hosted runner needs actions/setup-dotnet first.
    - name: Install ReportGenerator
      if: inputs.html_report == 'true'
      # Same contract as the Sonar installer: this must never be able to fail the gate.
      # If it fails, no renderer is on PATH and brimyr reports "skipped".
      continue-on-error: true
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v dotnet >/dev/null 2>&1; then
          echo "::warning::html_report needs the .NET runtime — add actions/setup-dotnet"
          exit 0
        fi
        dotnet tool install --global dotnet-reportgenerator-globaltool >/dev/null 2>&1 \
          || dotnet tool update --global dotnet-reportgenerator-globaltool >/dev/null 2>&1 \
          || true
        echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
        echo "using reportgenerator"

    # The other half of quality assurance, run by the tool that already owns a finished
    # net-new engine. Deliberately a nested composite action and not a shared package:
    # every argument against sharing one (version skew, uv.lock drift, a diamond in one
    # job, mutating a consumer's interpreter) is an argument about imports into a shared
    # interpreter, and a subprocess in its own environment has none of those properties.
    # Dependabot bumps the SHA below like every other pinned action. See brimyr#33.
    #
    # `fail_on: none` is load-bearing: Chargate must never set this job's exit code.
    # It classifies and counts; brimyr reads the two files it leaves behind and decides.
    #
    # `setup_python: false` is also load-bearing. Chargate's own setup-python step would
    # replace the job's interpreter with ITS default version — and the consumer's tests
    # run on the job's interpreter, so a nested setup would silently change the Python
    # that `brimyr ci` then runs pytest with. brimyr's setup-python has already run.
    #
    # It does mean chargate pip-installs itself into the job's interpreter, which is the
    # side effect brimyr's own venv installer (#32) exists to avoid. The cost is bounded
    # and known rather than overlooked: chargate declares `dependencies = []` too, so
    # this adds one package directory and one console script and resolves nothing. If
    # that ever stops being true, this step needs its own venv the way brimyr's does.
    #
    # continue-on-error: a MegaLinter or Docker failure must not take the coverage gate
    # down with it. It does NOT become a silent pass: the counts file is then missing,
    # and brimyr exits 2 saying it could not read it. A gate that cannot evaluate must
    # not go green — it just should not also erase the half that did work.
    - name: Quality findings (Chargate)
      id: quality
      if: ${{ inputs.quality == 'true' }}
      continue-on-error: true
      uses: magmamoose/chargate@f824b2cc8d06a1c4b4a43ad273eb0d42f06564c1 # v2.11.12
      with:
        checkout: 'false'
        setup_python: 'false'
        # Load-bearing. Both tools resolve their own mode from GITHUB_EVENT_NAME when
        # this is 'auto', which agrees — until someone forces `mode: pr` on a non-PR
        # event (merge_group, push, workflow_dispatch), which this action documents as
        # supported. Then brimyr would gate while chargate quietly ran a BASELINE scan,
        # whose net-new set is empty by construction: a permanently clean quality half
        # sitting next to a coverage gate that works, on every PR, forever.
        mode: ${{ inputs.mode }}
        flavor: 'quality'
        standalone_linters: ${{ inputs.quality_linters }}
        fail_on: 'none'
        pr_comment: 'false'
        upload_github_sarif: 'false'
        emit_sarif_artifact: 'false'
        base_ref: ${{ inputs.base_ref }}
        head_ref: ${{ inputs.head_ref }}
        github_token: ${{ inputs.github_token }}

    - name: Brimyr gate
      id: brimyr
      shell: bash
      env:
        BRIMYR_BIN: ${{ steps.install.outputs.bin }}
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        SONAR_TOKEN: ${{ inputs.sonar_token }}
        BASE_REF_IN: ${{ inputs.base_ref }}
        HEAD_REF_IN: ${{ inputs.head_ref }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        GH_SHA: ${{ github.sha }}
        # All inputs flow through env (never interpolated into the script body)
        # so a malicious value can't break out of the shell — defense-in-depth
        # against `${{ }}` template injection.
        MODE_IN: ${{ inputs.mode }}
        THRESHOLD_IN: ${{ inputs.threshold }}
        MIN_LINES_IN: ${{ inputs.min_lines }}
        STRIP_PREFIX_IN: ${{ inputs.strip_prefix }}
        EXCLUDE_IN: ${{ inputs.exclude }}
        ECOSYSTEM_IN: ${{ inputs.ecosystem }}
        TEST_COMMAND_IN: ${{ inputs.test_command }}
        COVERAGE_FILE_IN: ${{ inputs.coverage_file }}
        SONAR_URL_IN: ${{ inputs.sonar_url }}
        SONAR_PROJECT_KEY_IN: ${{ inputs.sonar_project_key }}
        SONAR_ORG_IN: ${{ inputs.sonar_organization }}
        SONAR_SOURCES_IN: ${{ inputs.sonar_sources }}
        SONAR_ARGS_IN: ${{ inputs.sonar_args }}
        HTML_REPORT_IN: ${{ inputs.html_report }}
        PR_COMMENT_IN: ${{ inputs.pr_comment }}
        QUALITY_IN: ${{ inputs.quality }}
        QUALITY_FAIL_ON_IN: ${{ inputs.quality_fail_on }}
        QUALITY_COUNTS_IN: ${{ steps.quality.outputs.counts_path }}
        QUALITY_FINDINGS_IN: ${{ steps.quality.outputs.filtered_sarif_path }}
        # 'success' | 'failure' | 'skipped' — see the guard in the script below.
        QUALITY_OUTCOME_IN: ${{ steps.quality.outcome }}
        # Linters chargate could not run, with a reason for each. Empty on a full scan.
        # An exit-0 chargate run is NOT proof the scan was complete — a linter it
        # declined to start reports nothing, which is what a clean repo also looks like.
        QUALITY_SKIPPED_IN: ${{ steps.quality.outputs.linters_skipped }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        PR_NUMBER_IN: ${{ github.event.pull_request.number }}
        TOKEN_BROKER_URL_IN: ${{ inputs.token_broker_url }}
      run: |
        set -euo pipefail
        json_rel="brimyr-reports/coverage.json"
        json_abs="${GITHUB_WORKSPACE:-$PWD}/$json_rel"
        mkdir -p "$(dirname "$json_abs")"
        echo "json_path=$json_rel" >> "$GITHUB_OUTPUT"

        quality_json_rel="brimyr-reports/quality.json"
        quality_json_abs="${GITHUB_WORKSPACE:-$PWD}/$quality_json_rel"

        base="${BASE_REF_IN:-$PR_BASE_SHA}"
        head="${HEAD_REF_IN:-${PR_HEAD_SHA:-$GH_SHA}}"

        html_dir="brimyr-reports/coverage-html"
        if [ "$HTML_REPORT_IN" = "true" ]; then
          echo "html_dir=$html_dir" >> "$GITHUB_OUTPUT"
        fi

        args=(ci
          --mode "$MODE_IN"
          --threshold "$THRESHOLD_IN"
          --min-lines "$MIN_LINES_IN"
          --repo "."
          --head "$head"
          --json-out "$json_abs")
        [ "$HTML_REPORT_IN" = "true" ] && args+=(--html-report "$html_dir")
        [ -n "$base" ] && args+=(--base "$base")
        [ -n "$TEST_COMMAND_IN" ] && args+=(--test-command "$TEST_COMMAND_IN")

        IFS=',' read -ra _eco <<< "$ECOSYSTEM_IN"
        for e in "${_eco[@]}"; do [ -n "$e" ] && args+=(--ecosystem "$e"); done
        IFS=',' read -ra _cov <<< "$COVERAGE_FILE_IN"
        for c in "${_cov[@]}"; do [ -n "$c" ] && args+=(--coverage-file "$c"); done
        IFS=',' read -ra _sp <<< "$STRIP_PREFIX_IN"
        for p in "${_sp[@]}"; do [ -n "$p" ] && args+=(--strip-prefix "$p"); done
        IFS=',' read -ra _ex <<< "$EXCLUDE_IN"
        for e in "${_ex[@]}"; do [ -n "$e" ] && args+=(--exclude "$e"); done

        if [ -n "$SONAR_URL_IN" ]; then
          args+=(--sonar-url "$SONAR_URL_IN")
          [ -n "$SONAR_PROJECT_KEY_IN" ] && args+=(--sonar-project-key "$SONAR_PROJECT_KEY_IN")
          [ -n "$SONAR_ORG_IN" ] && args+=(--sonar-organization "$SONAR_ORG_IN")
          [ -n "$SONAR_SOURCES_IN" ] && args+=(--sonar-sources "$SONAR_SOURCES_IN")
          IFS=',' read -ra _sa <<< "$SONAR_ARGS_IN"
          for a in "${_sa[@]}"; do [ -n "$a" ] && args+=(--sonar-arg "$a"); done
        fi

        # Deliberately NOT guarded on the file existing. If the Chargate step failed
        # (it is continue-on-error) the path is empty or the file is absent, and brimyr
        # exits 2 saying so — which is the point. Skipping the flag here would turn a
        # quality scan that never ran into a clean bill of health.
        #
        # And the file EXISTING is not proof the scan worked. `chargate ci` writes its
        # counts JSON before it decides whether the scan produced any runs, so a scan
        # that found nothing leaves a well-formed row of zeros on disk and only then
        # exits 2 — which reads exactly like a clean pull request. The step's own
        # outcome is the only thing that distinguishes them, so it is what we trust.
        if [ "$QUALITY_IN" = "true" ]; then
          echo "quality_json_path=$quality_json_rel" >> "$GITHUB_OUTPUT"
          args+=(--quality-fail-on "$QUALITY_FAIL_ON_IN" --quality-json-out "$quality_json_abs")
          if [ "$QUALITY_OUTCOME_IN" = "success" ]; then
            args+=(--quality-counts "${QUALITY_COUNTS_IN:-chargate-reports/counts.json}")
            [ -n "$QUALITY_FINDINGS_IN" ] && args+=(--quality-findings "$QUALITY_FINDINGS_IN")
            # A scan that ran fewer linters than asked is a smaller scan, and a smaller
            # scan reporting nothing is indistinguishable from a clean one. Say so on
            # the PR rather than letting it pass as a full result.
            [ -n "$QUALITY_SKIPPED_IN" ] && args+=(--quality-scan-note "$QUALITY_SKIPPED_IN")
          else
            echo "::warning::Chargate quality scan did not complete (outcome:" \
              "$QUALITY_OUTCOME_IN) — reporting a tool error, not a clean quality half."
            args+=(--quality-scan-broken)
          fi
        fi

        if [ "$PR_COMMENT_IN" = "true" ] && [ -n "${PR_NUMBER_IN:-}" ]; then
          args+=(--pr-comment --pr-number "$PR_NUMBER_IN")
          [ -n "$TOKEN_BROKER_URL_IN" ] && args+=(--token-broker-url "$TOKEN_BROKER_URL_IN")
        fi

        "$BRIMYR_BIN" "${args[@]}"

    - name: Upload HTML coverage report
      # always(): a failing gate (exit 1) would otherwise skip every later step, and the
      # HTML report is MOST useful exactly when coverage fell short — that is when someone
      # wants to browse it to find what is uncovered. Same reason the JSON artifact below
      # carries it.
      if: ${{ always() && inputs.html_report == 'true' && steps.brimyr.outputs.html_dir != '' }}
      continue-on-error: true
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.html_artifact_name }}
        path: ${{ steps.brimyr.outputs.html_dir }}
        if-no-files-found: ignore

    - name: Upload coverage JSON artifact
      if: ${{ always() && inputs.emit_json_artifact == 'true' && steps.brimyr.outputs.json_path != '' && hashFiles(steps.brimyr.outputs.json_path) != '' }}
      continue-on-error: true
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.json_artifact_name }}
        path: ${{ steps.brimyr.outputs.json_path }}

    - name: Upload quality JSON artifact
      # hashFiles() guards it: on a run where the Chargate step failed, brimyr exited 2
      # before writing this, and an upload step that fails on a missing file would bury
      # the real error under a second one.
      if: ${{ always() && inputs.emit_json_artifact == 'true' && steps.brimyr.outputs.quality_json_path != '' && hashFiles(steps.brimyr.outputs.quality_json_path) != '' }}
      continue-on-error: true
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.quality_json_artifact_name }}
        path: ${{ steps.brimyr.outputs.quality_json_path }}
