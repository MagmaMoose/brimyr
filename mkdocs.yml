site_name: Brimyr
site_description: >-
  Quality assurance for a pull request — auto-detect the ecosystem, run tests
  with coverage, and gate on the coverage of the lines a PR changed (diff-cover
  style) plus the net-new quality findings it introduced.
repo_url: https://github.com/MagmaMoose/brimyr
repo_name: MagmaMoose/brimyr
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: purple
      accent: purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: purple
      accent: purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Patch coverage: patch-coverage.md
  - Quality findings: quality-findings.md
  - Setup & usage: setup.md
  - .NET solutions: dotnet.md
  - Java / JVM: java.md
  - PR comment: pr-comment.md
  - HTML report: html-report.md
  - SonarQube: sonarqube.md
  - Troubleshooting: troubleshooting.md
  - Action reference: action.md
  - CLI reference: cli.md

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - toc:
      permalink: true
