# Org MkDocs docs site — build strictly, then publish to GitHub Pages.
#
# Provisioned by Caldrith from MagmaMoose/admin (files/workflows/docs.yml). Edit it
# THERE, not here; a local edit is reconciled away on the next run.
#
# Scoped by `only_repos` to the repos that actually publish: a repo without a
# mkdocs.yml would get a workflow that fails on every push. Publishing is deliberately
# NOT extended to the private repos. On the Team plan a Pages site built from a private
# repo is served on the OPEN INTERNET — private publishing needs Enterprise Cloud — so
# turning this on for nievah/caldrith/dunmir/noctyr would world-publish proprietary
# internals. Their docs build in CI and are read in-repo until there is a gated host.
#
# Prerequisite, once per repo: Settings → Pages → Source = "GitHub Actions".
#
# `permissions:` and `environment:` live in THIS file rather than in a shared action on
# purpose — a composite action cannot declare either, so the Pages deploy can only ever
# be owned by the calling workflow.
name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_dispatch:

permissions:
  contents: read

# One Pages deployment at a time, and never cancel one midway: a cancelled deploy can
# leave the site serving a half-uploaded artifact.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Dependencies come from the `docs` dependency-group in pyproject.toml, resolved
      # through uv.lock like every other job in these repos.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.12'
      - name: Build (strict, fail on broken links)
        run: uv run --group docs mkdocs build --strict

      # `mkdocs --strict` catches broken links; nothing caught the house voice rule, so
      # em-dashes crept back into eight pages between one docs sync and the next. This is
      # the whole rule in six lines: no dependency, no vendored script, and it fails on
      # the PR that introduces them rather than at the next manual audit.
      - name: Voice check (no em-dashes in published prose)
        run: |
          set -euo pipefail
          if grep -rn '[—–]' docs/ ; then
            echo "::error::em-dash or en-dash found in docs/. Use a comma, a colon, parentheses, or two sentences."
            exit 1
          fi
          echo "docs/ is free of em-dashes"

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
